# Build and release the engine app and its installer for Windows and Linux.
#
# The version comes from emoeng/const.py - nowhere else.
#
# A release is a one-shot event: the first run that finds `engineV<version>`
# unpublished creates the tag at its own commit and uploads four assets.
# Later runs of an already-published version only build and test - a pushed
# tweak to the workflow can never rewrite the files people installed from.
# To re-publish a version: delete its release and run this workflow again;
# a leftover tag with no release is cleared automatically, so the new one
# lands on the right commit instead of silently reusing the old anchor.
#
#   MotionEngine-windows.zip         one-file bundle, from build_release.py
#   MotionEngine-linux.tar.gz        (carries projects/ beside the exe)
#   MotionEngine-installer.exe       the standalone installer app,
#   MotionEngine-installer           from build_installer.py - plain
#                                    executables, not archived; the
#                                    Linux one needs `chmod +x` after
#                                    download, GitHub strips that bit
#
# The bundle names are what installer/installer.py searches for: it
# looks for the newest `engineV*` release and picks the file whose name
# matches this PC. The installer's own assets are always named with
# the word `installer` in them, which scores zero in its asset picker -
# it can never grab a copy of itself instead of the engine.
name: Build and release

on:
  push:
    branches: [master]
    paths:
      - emoeng/const.py            # a version bump is a release
      - emoeng/**                  # the app *is* the engine: build and
      - installer/installer.py     # what the installer freeze packs
      - tools/build_release.py     # the app freeze
      - tools/build_installer.py   # the installer freeze
      - .github/workflows/build.yml
  workflow_dispatch:

# one release flow at a time: two runs deciding "not yet published"
# in parallel would fight over the tag
concurrency:
  group: release-flow
  cancel-in-progress: false

permissions:
  contents: write                  # tag, release, assets
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      commit: ${{ steps.read.outputs.commit }}
      publish: ${{ steps.read.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          v=$(python3 - <<'EOF'
          import re
          text = open("emoeng/const.py", encoding="utf-8").read()
          print(re.search(r'^VERSION = "(.*)"', text, re.M).group(1))
          EOF
          )
          if [ -z "$v" ]; then
            echo "no VERSION line in emoeng/const.py" >&2
            exit 1
          fi
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "VERSION must look like X.Y.Z, got '$v'" >&2; exit 1 ;;
          esac
          tag="engineV$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published - this run only verifies"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "$tag is not published - this run will publish it"
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            app_asset: MotionEngine-windows.zip
            installer_asset: MotionEngine-installer.exe
          # Build against the oldest supported Linux baseline (glibc 2.35).
          - os: ubuntu-22.04
            label: linux
            app_asset: MotionEngine-linux.tar.gz
            installer_asset: MotionEngine-installer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # shell: bash everywhere these steps use unix syntax - a Windows
      # runner's default shell is PowerShell, which cannot read `if [...]`
      # requirements-build.txt pins the set the release is built with, so a
      # runner can never freeze against a version no machine was tested on
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      # Linux: SDL2 and OpenGL dev libraries for pygame, plus xvfb and
      # glxinfo to run and diagnose a headless window. No upx here:
      # PyInstaller ignores UPX on non-Windows regardless of it being
      # installed, so the Linux installer ships uncompressed.
      - name: Install SDL2 and OpenGL (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev xvfb x11-utils

      # Windows: PyInstaller compresses the bundled SDL and Python
      # binaries with whatever upx it finds on PATH, halving size
      - name: Install UPX (Windows)
        if: matrix.label == 'windows'
        shell: bash
        run: choco install upx --no-progress -y

      # The repo's own build tool: freezes emoeng into
      # tools/dist/MotionEngine.exe (Windows) or MotionEngine (Linux)
      # with the engine CLI baked in, the projects folder already copied beside the exe.
      # --no-run because a headless runner must not try to open a window.
      - name: Freeze the app
        shell: bash
        run: python tools/build_release.py --no-run

      # the same for the installer: a second, much smaller one-file
      # bundle that needs only pygame and the engine chrome
      - name: Freeze the installer
        shell: bash
        run: python tools/build_installer.py

      # The frozen app must open a real GL window with no GPU behind it.
      # xvfb-run's own default screen is 8-bit, which is not a depth a GL
      # context is built on, so the geometry is stated here.
      - name: Report the GL driver (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo | grep -E \
            "OpenGL (renderer|major|version|shading language)" || true

      - name: Smoke test (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          SDL_AUDIODRIVER=dummy xvfb-run -a -s "-screen 0 1280x720x24" \
            tools/dist/MotionEngine run tools/dist/projects/demo --frames 1

      # Exercise the frozen Windows app's dispatcher and project payload
      # without opening a graphics window; the hosted runner has no GL stack.
      - name: Smoke test the app (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP ("emoeng-smoke-" + [guid]::NewGuid().ToString("N"))
          try {
            $app = (Resolve-Path 'tools\dist\MotionEngine.exe').Path
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new($app)
            $startInfo.Arguments = "new `"$project`" `"Windows CI Smoke`""
            $process = [System.Diagnostics.Process]::Start($startInfo)
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) {
              throw "app project-creation command exited with $($process.ExitCode)"
            }
            if (-not (Test-Path (Join-Path $project 'project.flig'))) {
              throw "app did not create project.flig at $project"
            }
            Write-Output 'frozen app created a project without opening a graphics window'
          }
          finally {
            if (Test-Path $project) {
              Remove-Item -LiteralPath $project -Recurse -Force
            }
          }

      # the installer is a GUI with no frame cap and no GL need, so
      # "still alive when the clock ran out" is the pass condition:
      # any earlier exit is a crash, and a crash here means the freeze
      # or its bundled data layout is broken. The 124 is grabbed with
      # `||` because Actions' bash runs -e, which would treat the
      # expected kill as a step failure before $? could ever be read
      - name: Smoke test the installer (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          code=0
          SDL_AUDIODRIVER=dummy xvfb-run -a -s "-screen 0 1280x720x24" \
            timeout 30 tools/dist/MotionEngine-installer || code=$?
          if [ "$code" != "124" ]; then
            echo "installer exited with $code" >&2
            exit 1
          fi

      # The frozen *app* is not smoke-tested on Windows: a runner has no
      # GPU and no software GL stack the way Linux has llvmpipe, so a GL
      # context there proves nothing about real machines. The installer
      # needs no GL, so it does get run.
      - name: Smoke test the installer (Windows)
        if: matrix.label == 'windows'
        shell: pwsh
        run: |
          $env:SDL_AUDIODRIVER = 'dummy'
          $p = Start-Process -FilePath 'tools\dist\MotionEngine-installer.exe' -PassThru
          if ($p.WaitForExit(30000)) {
            Write-Output "installer exited early with $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Output "installer alive at 30s (pass)"

      # both release assets for this platform, named exactly: a missing
      # file is an error here, not a warning that a later step shrugs off
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-bundle
          if-no-files-found: error
          path: |
            tools/dist/${{ matrix.app_asset }}
            tools/dist/${{ matrix.installer_asset }}

  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-bundle'
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VER: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        shell: bash
        run: |
          ls -l
          # deleting a release often leaves its tag behind; gh would then
          # attach the new release to that stale anchor instead of this
          # commit. Clear the orphan first so the tag is created here.
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "deleting orphan tag $TAG (no release attached)"
            git push --delete origin "refs/tags/$TAG"
          fi
          gh release create "$TAG" --target "$COMMIT" \
            --title "$TAG" \
            --notes "Motion Engine $VER: unzip the app archive for your OS, or run the installer executable (Linux: chmod +x it first). Built from emoeng/const.py"
          gh release upload "$TAG" MotionEngine-*
          # the release is only done when all four assets are actually
          # there and carry bytes: the installer's whole job is finding
          # them, and a silent empty asset sends every user a 404
          fail=0
          for a in MotionEngine-windows.zip MotionEngine-linux.tar.gz \
                   MotionEngine-installer.exe MotionEngine-installer; do
            size=$(gh release view "$TAG" --json assets \
                   -q ".assets[] | select(.name == \"$a\") | .size" 2>/dev/null)
            if [ -z "$size" ] || [ "$size" -lt 100000 ]; then
              echo "asset missing or implausibly small: $a ($size)" >&2
              fail=1
            else
              echo "asset ok: $a ($size bytes)"
            fi
          done
          if [ "$fail" != "0" ]; then
            exit 1
          fi
          gh release view "$TAG"
