# Build and release the engine app and its installer for Windows and Linux.
#
# The version comes from emoeng/const.py - nowhere else. Pushing a new
# VERSION there (or running this workflow by hand) tags the commit
# `engineV<version>` and publishes a GitHub release carrying one
# installable archive per OS, plus the installer that fetches them:
#
#   MotionEngine-windows.zip         one-file bundle, from build_release.py
#   MotionEngine-linux.tar.gz        (carries projects/ beside the exe)
#   MotionEngine-installer-windows.zip   the standalone installer app
#   MotionEngine-installer-linux.tar.gz
#
# The bundle names are what installer/installer.py searches for: it
# looks for the newest `engineV*` release and picks the file whose name
# matches this PC. The installer's own archives are always named with
# the word `installer` in them, which scores zero in its asset picker -
# it can never grab a copy of itself instead of the engine. A re-run of
# the same version replaces the files in place rather than failing on
# the existing tag.
name: Build and release

on:
  push:
    branches: [master]
    paths:
      - emoeng/const.py            # a version bump is a release
      - tools/build_release.py
      - installer/installer.py
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write                  # tag, release, assets
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      commit: ${{ steps.read.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          v=$(python3 - <<'EOF'
          import re
          text = open("emoeng/const.py", encoding="utf-8").read()
          print(re.search(r'^VERSION = "(.*)"', text, re.M).group(1))
          EOF
          )
          if [ -z "$v" ]; then
            echo "no VERSION line in emoeng/const.py" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=engineV$v" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "releasing engineV$v from $(git rev-parse --short HEAD)"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-24.04
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # shell: bash everywhere these steps use unix syntax - a Windows
      # runner's default shell is PowerShell, which cannot read `if [...]`
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame moderngl numpy pillow pyinstaller

      # Linux: SDL2 and OpenGL dev libraries for pygame, plus xvfb and
      # glxinfo to run and diagnose a headless window
      - name: Install SDL2 and OpenGL (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libsdl2-dev libgl1-mesa-dev libglu1-mesa-dev xvfb x11-utils

      # The repo's own build tool: freezes emoeng into
      # tools/dist/MotionEngine.exe (Windows) or MotionEngine (Linux)
      # with the engine CLI baked in, the projects folder already copied beside the exe.
      # --no-run because a headless runner must not try to open a window.
      - name: Freeze the app
        shell: bash
        run: python tools/build_release.py --no-run

      # The frozen app must open a real GL window with no GPU behind it.
      # xvfb-run's own default screen is 8-bit, which is not a depth a GL
      # context is built on, so the geometry is stated here.
      - name: Report the GL driver (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo | grep -E \
            "OpenGL (renderer|major|version|shading language)" || true

      - name: Smoke test (Linux)
        if: matrix.label == 'linux'
        shell: bash
        run: |
          SDL_AUDIODRIVER=dummy xvfb-run -a -s "-screen 0 1280x720x24" \
            tools/dist/MotionEngine run tools/dist/projects/demo --frames 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}-bundle
          path: tools/dist/MotionEngine*

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-bundle'
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VER: ${{ needs.version.outputs.version }}
          COMMIT: ${{ needs.version.outputs.commit }}
        shell: bash
        run: |
          ls -l
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$COMMIT" \
              --title "$TAG" \
              --notes "Motion Engine $VER, built from emoeng/const.py"
          fi
          gh release upload "$TAG" MotionEngine-* --clobber
          gh release view "$TAG"